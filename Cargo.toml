[package]
name = "ytop"
version = "0.2.0"
edition = "2021"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cpal = "0.15"
ureq = "2"
serde_json = "1"
sha1_smol = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
